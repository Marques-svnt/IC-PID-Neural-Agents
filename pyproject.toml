[project]
name = "pid-neural-control-proic"
version = "0.1.0"
description = "PID Classical vs Neural Control with Multi-Agent System (LangGraph) - PROIC/UESC"
requires-python = ">=3.11"

dependencies = [
    # Numerical / Scientific
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "seaborn>=0.13",
    # Control Systems
    "control>=0.9",
    # Machine Learning / Neural Networks
    "torch>=2.3",
    "scikit-learn>=1.4",
    # LLM / Agents
    "langchain>=0.2",
    "langchain-google-genai>=1.0",
    "langgraph>=0.1",
    "langsmith>=0.1",
    "langfuse>=2.0.0",
    "mcp>=1.0.0",
    # Reporting
    "jinja2>=3.1",
    # Dev / Quality
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
rl = [
    "stable-baselines3>=2.3",
    "gymnasium>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
    "isort>=5.13",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
